<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tekstrol voor Canvas iframe</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: transparent;
      color: white;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pagina {
      width: 100%;
      max-width: 1050px;
      min-height: 520px;
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 22px;
      padding: 22px;
      background: #171a2b;
      border-radius: 22px;
    }

    .knoppen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 15px;
      padding: 18px;
      background: #24283d;
      border-radius: 18px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff8a00, #ff3d77);
      box-shadow: 0 7px 0 #8f1d42;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #8f1d42;
    }

    .scherm-rand {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #080a12;
      border: 8px solid #f4c542;
      border-radius: 22px;
      overflow: hidden;
    }

    .scherm {
      width: 100%;
      min-height: 250px;
      padding: 24px;
      background: #111423;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-align: center;
      position: relative;
    }

    #tekst {
      font-size: clamp(24px, 4vw, 44px);
      font-weight: 900;
      line-height: 1.2;
      white-space: pre-wrap;
      text-shadow: 0 4px 12px rgba(0,0,0,0.6);
    }

    .rollen {
      animation: tekstrol 0.12s linear infinite;
    }

    @keyframes tekstrol {
      0% {
        transform: translateY(-90px);
        opacity: 0.25;
        filter: blur(3px);
      }
      50% {
        transform: translateY(0);
        opacity: 1;
        filter: blur(0);
      }
      100% {
        transform: translateY(90px);
        opacity: 0.25;
        filter: blur(3px);
      }
    }

    @media (max-width: 700px) {
      .pagina {
        grid-template-columns: 145px 1fr;
        gap: 12px;
        padding: 12px;
        min-height: 430px;
      }

      .knoppen {
        padding: 10px;
        gap: 10px;
      }

      button {
        font-size: 14px;
        padding: 12px 8px;
      }

      .scherm-rand {
        padding: 12px;
        border-width: 5px;
      }

      .scherm {
        min-height: 260px;
      }
    }
  </style>
</head>
<body>
  <main class="pagina">
    <aside class="knoppen">
      <button onclick="toonTekst(0)">Leeruitkomst</button>
      <button onclick="toonTekst(1)">Werkprocessen</button>
      <button onclick="toonTekst(2)">Wat heb je nodig?</button>
      <button onclick="toonTekst(3)">Wat lever je op?</button>
      <button onclick="toonTekst(4)">Hoe sluit je de cursus af?</button>
    </aside>

    <section class="scherm-rand">
      <div class="scherm">
        <div id="tekst">Druk op een knop</div>
      </div>
    </section>
  </main>

  <script>
    const teksten = [
      "De student monteert, installeert en configureert hardware en software conform opdracht en geldende procedures, waarbij hij/zij veiligheid, privacy en werkende netwerkaansluiting waarborgt, zorgvuldig en systematisch werkt, verspilling voorkomt en de werkzaamheden correct administreert.",
      "B1-K1-W1: maakt devices gebruiksklaar.
B1-K1-W2: installeert en onderhoudt software.
B1-K1-W3: lost technische problemen op.
B1-K2-W2: instrueert gebruikers.",
      "Je werkt met hardware, software, gereedschap en de opdrachten in Canvas. De benodigde materialen zijn aanwezig op school.",
      "Je levert opdrachten, bewijs van je werk, checklists of werkbonnen en het eindresultaat van het beroepsproject op.",
      "Je sluit de cursus af met het beroepsproject Sigrid Styling. Daarin laat je zien dat je een device zelfstandig en netjes gebruiksklaar kunt maken."
    ];

    let timer = null;
    let eindTimer = null;

    function toonTekst(index) {
      const tekstVak = document.getElementById("tekst");

      clearInterval(timer);
      clearTimeout(eindTimer);

      tekstVak.classList.add("rollen");

      let teller = index + 1;

      timer = setInterval(function () {
        tekstVak.textContent = teksten[teller % teksten.length];
        teller++;
      }, 120);

      eindTimer = setTimeout(function () {
        clearInterval(timer);
        tekstVak.classList.remove("rollen");
        tekstVak.textContent = teksten[index];
      }, 1600);
    }
  </script>
</body>
</html>
