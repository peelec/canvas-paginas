<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tekstrol met knoppen</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #20243a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pagina {
      width: min(1100px, 96vw);
      min-height: 600px;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 24px;
      padding: 24px;
      border-radius: 24px;
      background: #171a2b;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .knoppen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      padding: 20px;
      border-radius: 18px;
      background: #24283d;
    }

    .knoppen button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff8a00, #ff3d77);
      box-shadow: 0 7px 0 #8f1d42;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .knoppen button:hover { filter: brightness(1.08); }

    .knoppen button:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #8f1d42;
    }

    .knoppen button.actief { outline: 4px solid white; }

    .scherm-rand {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      border-radius: 24px;
      background: #080a12;
      border: 8px solid #f4c542;
      overflow: hidden;
      position: relative;
    }

    .scherm {
      width: 100%;
      max-width: 700px;
      min-height: 300px;
      padding: 30px;
      border-radius: 20px;
      background: linear-gradient(180deg, #151827, #0e101a);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .starttekst {
      font-size: clamp(28px, 4vw, 46px);
      font-weight: 900;
      line-height: 1.2;
    }

    .rolvenster {
      position: absolute;
      inset: 0;
      overflow: hidden;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .rolvenster.aan {
      display: flex;
      animation: rolVerdwijnt 0.25s linear forwards;
      animation-delay: 1.65s;
    }

    .rolstrook {
      position: absolute;
      width: 100%;
    }

    .rolvenster.aan .rolstrook {
      animation: rolBeweging 1.7s cubic-bezier(.12,.72,.16,1) forwards;
    }

    .rolregel {
      min-height: 80px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(24px, 3.7vw, 42px);
      font-weight: 900;
      line-height: 1.15;
      text-shadow: 0 4px 12px rgba(0,0,0,0.65);
    }

    .eindtekst {
      display: none;
      opacity: 0;
      transform: scale(0.9);
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 900;
      line-height: 1.2;
      text-shadow: 0 4px 12px rgba(0,0,0,0.65);
    }

    .eindtekst.aan {
      display: block;
      animation: eindtekstBinnen 0.45s ease forwards;
    }

    @keyframes rolBeweging {
      0% { transform: translateY(-300px); filter: blur(5px); }
      15% { transform: translateY(-190px); filter: blur(4px); }
      30% { transform: translateY(-80px); filter: blur(3px); }
      48% { transform: translateY(45px); filter: blur(2px); }
      64% { transform: translateY(-25px); filter: blur(1px); }
      80% { transform: translateY(12px); filter: blur(0); }
      100% { transform: translateY(0); filter: blur(0); }
    }

    @keyframes rolVerdwijnt {
      to { opacity: 0; visibility: hidden; }
    }

    @keyframes eindtekstBinnen {
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 760px) {
      .pagina {
        grid-template-columns: 145px 1fr;
        gap: 12px;
        padding: 12px;
        min-height: 480px;
      }

      .knoppen {
        padding: 10px;
        gap: 10px;
      }

      .knoppen button {
        font-size: 14px;
        padding: 12px 8px;
      }

      .scherm-rand {
        padding: 12px;
        border-width: 5px;
      }

      .scherm {
        min-height: 300px;
        padding: 16px;
      }

      .rolregel { min-height: 72px; }
    }
  </style>
</head>
<body>

  <main class="pagina">
    <aside class="knoppen">
      <button onclick="toonTekst(0, this)">Leeruitkomst</button>
      <button onclick="toonTekst(1, this)">Werkprocessen</button>
      <button onclick="toonTekst(2, this)">Wat heb je nodig?</button>
      <button onclick="toonTekst(3, this)">Wat lever je op?</button>
      <button onclick="toonTekst(4, this)">Hoe sluit je de cursus af?</button>
    </aside>

    <section class="scherm-rand">
      <div class="scherm">
        <div id="starttekst" class="starttekst">Klik op een knop</div>
        <div id="rolvenster" class="rolvenster">
          <div id="rolstrook" class="rolstrook"></div>
        </div>
        <div id="eindtekst" class="eindtekst"></div>
      </div>
    </section>
  </main>

  <script>
    const teksten = [
      "De student monteert, installeert en configureert hardware en software conform opdracht en geldende procedures, waarbij hij/zij veiligheid, privacy en werkende netwerkaansluiting waarborgt, zorgvuldig en systematisch werkt, verspilling voorkomt en de werkzaamheden correct administreert.",
      "B1-K1-W1: maakt devices gebruiksklaar.
B1-K1-W2: installeert en onderhoudt software.
B1-K1-W3: lost technische problemen op.
B1-K2-W2: instrueert gebruikers.",
      "Je werkt met hardware, software, gereedschap en de opdrachten in Canvas. De benodigde materialen zijn aanwezig op school.",
      "Je levert opdrachten, bewijs van je werk, checklists of werkbonnen en het eindresultaat van het beroepsproject op.",
      "Je sluit de cursus af met het beroepsproject Sigrid Styling. Daarin laat je zien dat je een device zelfstandig en netjes gebruiksklaar kunt maken."
    ];

    let wachttimer = null;

    function toonTekst(index, knop) {
      const starttekst = document.getElementById("starttekst");
      const rolvenster = document.getElementById("rolvenster");
      const rolstrook = document.getElementById("rolstrook");
      const eindtekst = document.getElementById("eindtekst");

      clearTimeout(wachttimer);

      document.querySelectorAll(".knoppen button").forEach(function(btn) {
        btn.classList.remove("actief");
      });
      knop.classList.add("actief");

      starttekst.style.display = "none";
      eindtekst.classList.remove("aan");
      eindtekst.textContent = "";

      rolvenster.classList.remove("aan");

      const volgorde = [
        teksten[(index + 1) % teksten.length],
        teksten[(index + 2) % teksten.length],
        teksten[(index + 3) % teksten.length],
        teksten[(index + 4) % teksten.length],
        teksten[index]
      ];

      rolstrook.innerHTML = volgorde.map(function(tekst) {
        return "<div class='rolregel'>" + tekst + "</div>";
      }).join("");

      void rolvenster.offsetWidth;

      rolvenster.style.opacity = "1";
      rolvenster.style.visibility = "visible";
      rolvenster.classList.add("aan");

      wachttimer = setTimeout(function() {
        eindtekst.textContent = teksten[index];
        eindtekst.classList.add("aan");
      }, 1800);
    }
  </script>

</body>
</html>
