<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tekstrol Compact</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #20243a, #10121f);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 12px;
    }

    .pagina {
      width: min(1000px, 96vw);
      height: 500px;
      max-height: 500px;
      display: grid;
      grid-template-columns: 210px 1fr;
      gap: 16px;
      padding: 16px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .knoppen {
      grid-column: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 11px;
      padding: 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      min-height: 0;
      overflow: hidden;
    }

    button {
      width: 100%;
      padding: 12px 10px;
      border: none;
      border-radius: 13px;
      font-size: 14px;
      line-height: 1.15;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #ff8a00, #ff3d77);
      box-shadow: 0 6px 0 #8f1d42;
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #8f1d42;
    }

    .scherm-container {
      grid-column: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      border-radius: 22px;
      background: #080a12;
      border: 6px solid #f4c542;
      box-shadow:
        inset 0 0 28px rgba(255, 255, 255, 0.08),
        0 0 24px rgba(244, 197, 66, 0.35);
      overflow: hidden;
      position: relative;
      min-height: 0;
    }

    .scherm-container::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 14px;
      border: 2px dashed rgba(255, 255, 255, 0.14);
      pointer-events: none;
    }

    .scherm {
      width: 100%;
      max-width: 650px;
      height: 300px;
      max-height: 300px;
      padding: 22px;
      border-radius: 18px;
      background: linear-gradient(180deg, #151827, #0e101a);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    .tekst {
      font-size: clamp(13px, 2.1vw, 20px);
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: 0.5px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
      white-space: pre-wrap;
      max-height: 100%;
      overflow: auto;
      padding: 4px;
    }

    .rollen {
      animation: tekstrol 0.11s linear infinite;
    }

    @keyframes tekstrol {
      0% {
        transform: translateY(-85px);
        opacity: 0.2;
        filter: blur(3px);
      }
      45% {
        transform: translateY(0);
        opacity: 1;
        filter: blur(0);
      }
      100% {
        transform: translateY(85px);
        opacity: 0.2;
        filter: blur(3px);
      }
    }

    .lampjes {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 6% 8%, #fff 0 4px, transparent 5px),
        radial-gradient(circle at 94% 8%, #fff 0 4px, transparent 5px),
        radial-gradient(circle at 6% 92%, #fff 0 4px, transparent 5px),
        radial-gradient(circle at 94% 92%, #fff 0 4px, transparent 5px);
      opacity: 0.9;
    }

    @media (max-width: 720px) {
      body {
        overflow: auto;
      }

      .pagina {
        width: 96vw;
        height: 500px;
        grid-template-columns: 160px 1fr;
        gap: 12px;
        padding: 12px;
      }

      .knoppen {
        padding: 10px;
        gap: 9px;
      }

      button {
        font-size: 12px;
        padding: 10px 7px;
      }

      .scherm-container {
        padding: 12px;
        border-width: 5px;
      }

      .scherm {
        height: 300px;
        padding: 16px;
      }

      .tekst {
        font-size: clamp(12px, 2.8vw, 16px);
      }
    }

    @media (max-width: 560px) {
      .pagina {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: 500px;
      }

      .knoppen {
        flex-direction: row;
        overflow-x: auto;
        justify-content: flex-start;
      }

      button {
        min-width: 130px;
      }

      .scherm-container {
        grid-column: 1;
      }

      .scherm {
        height: 260px;
      }
    }
  </style>
</head>
<body>
  <main class="pagina">
    <aside class="knoppen">
      <button onclick="toonTekst(0)">Leeruitkomst</button>
      <button onclick="toonTekst(1)">Werkproces</button>
      <button onclick="toonTekst(2)">Wat heb je nodig?</button>
      <button onclick="toonTekst(3)">Wat lever je op?</button>
      <button onclick="toonTekst(4)">Hoe sluit je de cursus af?</button>
    </aside>

    <section class="scherm-container">
      <div class="lampjes"></div>
      <div class="scherm">
        <div id="tekst" class="tekst">Druk op een knop</div>
      </div>
    </section>
  </main>

  <script>
    const teksten = [
      `De student monteert, installeert en configureert hardware en software conform opdracht en geldende procedures, waarbij hij/zij veiligheid, privacy en werkende netwerkaansluiting waarborgt, zorgvuldig en systematisch werkt, verspilling voorkomt en de werkzaamheden correct administreert.`,
      `B1-K1-W1: maakt devices gebruiksklaar.
B1-K1-W2: installeert en onderhoudt software.
B1-K1-W3: lost technische problemen op.
B1-K2-W2: instrueert gebruikers.`,
      `Je werkt met hardware, software, gereedschap en de opdrachten in Canvas. De benodigde materialen zijn aanwezig op school.`,
      `Je levert opdrachten, bewijs van je werk, checklists of werkbonnen en het eindresultaat van het beroepsproject op.`,
      `Je sluit de cursus af met het beroepsproject Sigrid Styling. Daarin laat je zien dat je een device zelfstandig en netjes gebruiksklaar kunt maken.`
    ];

    let timer = null;
    let eindTimer = null;

    function toonTekst(index) {
      const tekstVak = document.getElementById("tekst");

      clearInterval(timer);
      clearTimeout(eindTimer);

      tekstVak.classList.add("rollen");

      let teller = index + 1;

      timer = setInterval(() => {
        tekstVak.textContent = teksten[teller % teksten.length];
        teller++;
      }, 110);

      eindTimer = setTimeout(() => {
        clearInterval(timer);
        tekstVak.classList.remove("rollen");
        tekstVak.textContent = teksten[index];
      }, 1500);
    }
  </script>
</body>
</html>
