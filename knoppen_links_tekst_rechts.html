<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knoppen met tekst rechts</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f8;
    }

    .blok {
      max-width: 1000px;
      margin: 30px auto;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 20px;
      padding: 20px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .knoppen {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .knoppen button {
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #1f5fbf;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
    }

    .knoppen button:hover {
      background: #164a96;
    }

    .knoppen button.actief {
      background: #f28c00;
    }

    .tekstvak {
      min-height: 260px;
      padding: 30px;
      border-radius: 12px;
      background: #eef3ff;
      border: 2px solid #c8d8ff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .tekstvak h2 {
      margin: 0 0 12px 0;
      font-size: 32px;
      color: #1f3f75;
    }

    .tekstvak p {
      margin: 0;
      font-size: 22px;
      line-height: 1.5;
      color: #222;
    }

    @media (max-width: 700px) {
      .blok {
        grid-template-columns: 1fr;
      }

      .knoppen button {
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <div class="blok">
    <div class="knoppen">
      <button onclick="toonTekst(0)" class="actief">Knop 1</button>
      <button onclick="toonTekst(1)">Knop 2</button>
      <button onclick="toonTekst(2)">Knop 3</button>
      <button onclick="toonTekst(3)">Knop 4</button>
      <button onclick="toonTekst(4)">Knop 5</button>
    </div>

    <div class="tekstvak">
      <div>
        <h2 id="titel">Tekst 1</h2>
        <p id="tekst">Welkom bij tekst 1!</p>
      </div>
    </div>
  </div>

  <script>
    const inhoud = [
      {
        titel: "Tekst 1",
        tekst: "Welkom bij tekst 1!"
      },
      {
        titel: "Tekst 2",
        tekst: "Dit is de tweede boodschap."
      },
      {
        titel: "Tekst 3",
        tekst: "Hier staat de derde tekst."
      },
      {
        titel: "Tekst 4",
        tekst: "Knop vier laat deze tekst zien."
      },
      {
        titel: "Tekst 5",
        tekst: "Gefeliciteerd! Dit is tekst vijf."
      }
    ];

    function toonTekst(nummer) {
      document.getElementById("titel").textContent = inhoud[nummer].titel;
      document.getElementById("tekst").textContent = inhoud[nummer].tekst;

      const knoppen = document.querySelectorAll(".knoppen button");
      knoppen.forEach(function(knop) {
        knop.classList.remove("actief");
      });

      knoppen[nummer].classList.add("actief");
    }
  </script>

</body>
</html>
